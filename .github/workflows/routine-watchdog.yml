name: Routine watchdog

# The nightly resource-refresh and link-health jobs run as Claude Code routines
# in the Claude account, not in this repo (see ROUTINES.md). Nothing in git can
# see whether those routines are scheduled, enabled, or pointed at an
# environment with web access — so when one silently stops, nothing notices.
# Two of them sat un-scheduled and never fired once for six weeks.
#
# A routine that never executes cannot report its own absence, so the alarm has
# to run independently of it. This workflow only reads the files the routines
# are supposed to keep fresh, which is what lets it catch a routine that is not
# running at all.
on:
  schedule:
    # 12:00 UTC — well clear of the routines themselves (02:00–04:30 UTC), so a
    # night's runs have landed before we judge their freshness.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: routine-watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # stdlib only — no pip install step needed.
      - name: Check routine freshness
        id: check
        run: |
          if python scripts/routine-watchdog.py --report /tmp/watchdog.md; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the watchdog issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE: ${{ steps.check.outputs.stale }}
          TITLE: "Nightly routines have gone stale"
        run: |
          set -euo pipefail

          # Idempotent — the label may or may not exist yet.
          gh label create routine-watchdog \
            --color B60205 \
            --description "Opened automatically when a nightly routine stops running" \
            2>/dev/null || true

          existing=$(gh issue list \
            --label routine-watchdog --state open \
            --json number --jq '.[0].number // empty')

          if [ "$STALE" = "true" ]; then
            if [ -n "$existing" ]; then
              # Update in place rather than commenting, so the issue always shows
              # the current state instead of accreting a daily pile of duplicates.
              gh issue edit "$existing" --body-file /tmp/watchdog.md
              echo "Refreshed issue #$existing."
            else
              gh issue create \
                --title "$TITLE" \
                --label routine-watchdog \
                --body-file /tmp/watchdog.md
              echo "Opened a new watchdog issue."
            fi
          else
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "Every watchdog check passed again — the routines are producing fresh output. Closing automatically."
              echo "Closed issue #$existing."
            else
              echo "All clear; no open watchdog issue."
            fi
          fi
